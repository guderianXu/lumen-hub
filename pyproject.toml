[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-hub"
version = "0.1.0"
description = "Linux and Windows hardware control center for LCD screens, OpenRGB lighting, PWM fans, and LIAN LI wireless devices"
requires-python = ">=3.10"
dependencies = [
  "openrgb-python>=0.3.6",
  "Pillow>=10.0",
  "PySide6>=6.7",
]

[project.scripts]
lumen-hub = "usb9_lcd.gui.app:main"
lumen-hub-gui = "usb9_lcd.gui.app:main"
usb9-lcd = "usb9_lcd.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.0",
]
lianli = [
  "pyusb>=1.2",
  "pycryptodomex>=3.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["usb9_lcd*"]
