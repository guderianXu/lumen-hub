# Lumen Hub Linux PWM fan-control permissions.
# Install as /etc/tmpfiles.d/lumen-hub-pwm.conf, then run:
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/lumen-hub-pwm.conf
# These rules do not create files; they adjust exposed hwmon pwm* files when present.

z /sys/class/hwmon/hwmon*/pwm* 0660 root plugdev -
z /sys/class/hwmon/hwmon*/pwm*_enable 0660 root plugdev -
